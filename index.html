<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Concept Plan</title>
    <meta name="description" content="Plataforma de gestão de equipes em campo." />

    <!-- Tipografia -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Sora:wght@600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!--
      Tema antes da primeira pintura. Se esperasse o React montar, o app
      apareceria claro por um quadro e piscaria para o escuro.
    -->
    <script>
      (function () {
        try {
          var salvo = localStorage.getItem('tema')
          var escuro = salvo
            ? salvo === 'escuro'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (escuro) document.documentElement.classList.add('dark')
        } catch (e) { /* storage bloqueado: começa claro */ }
      })()
    </script>

    <!-- Open Graph / WhatsApp / redes sociais -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Concept Plan" />
    <meta property="og:description" content="Plataforma de gestão de equipes em campo." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Concept Plan" />
    <meta name="twitter:description" content="Plataforma de gestão de equipes em campo." />
    <meta name="twitter:image" content="/og-image.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
